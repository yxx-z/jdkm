# Build macOS binaries and publish them as a GitHub Release.
#
# Trigger: push a tag such as v0.1.0 whose version matches Cargo.toml.
#   git tag v0.1.0 && git push origin v0.1.0
#
# Asset names carry no version (jdkm-aarch64-apple-darwin.tar.gz), so
# install.sh can always fetch releases/latest/download/<name> without
# calling the GitHub API.
#
# Everything runs in ONE job on ONE macOS runner: x86_64 is cross-compiled on
# the Apple Silicon runner. A matrix with two macOS jobs got stuck waiting for
# a second runner ("not acquired by Runner ... capacity constraints").

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TARGETS: aarch64-apple-darwin x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$crate_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi

      - name: Install Rust targets
        run: rustup target add $TARGETS

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          for t in $TARGETS; do
            cargo build --release --locked --target "$t"
          done

      - name: Package
        run: |
          mkdir dist
          for t in $TARGETS; do
            name="jdkm-$t.tar.gz"
            tar -C "target/$t/release" -czf "dist/$name" jdkm
            (cd dist && shasum -a 256 "$name" > "$name.sha256")
            file "target/$t/release/jdkm"
          done
          cat dist/*.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
