# Build macOS binaries and publish them as a GitHub Release.
#
# Trigger: push a tag such as v0.1.0 whose version matches Cargo.toml.
#   git tag v0.1.0 && git push origin v0.1.0
#
# Asset names carry no version (jdkm-aarch64-apple-darwin.tar.gz), so
# install.sh can always fetch releases/latest/download/<name> without
# calling the GitHub API.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    # Apple Silicon runner; the x86_64 build is cross-compiled on it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$crate_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Test
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          name=jdkm-${{ matrix.target }}
          tar -C target/${{ matrix.target }}/release -czf "$name.tar.gz" jdkm
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: jdkm-${{ matrix.target }}
          path: jdkm-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
